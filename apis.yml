aid: anysphere
name: Anysphere
description: >-
  Anysphere is the applied-research company behind Cursor, the AI-native code editor and
  agent platform. Beyond the desktop app, Cursor ships a public Cloud Agents REST API
  (https://api.cursor.com) that lets developers programmatically create autonomous coding
  agents, submit prompt runs, stream run events over SSE, and retrieve produced artifacts,
  plus an Admin API for team member/usage/spend management and a first-party terminal CLI
  (the `agent` binary). Authentication is a dashboard-issued API key over HTTP Basic/Bearer.
  This profile was surfaced as a Thrive Capital portfolio company and enriched from Cursor's
  public developer surface.
